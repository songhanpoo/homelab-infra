databases:
  image:
    name: noble
    version: "26.04"
    factory_url: https://cloud-images.ubuntu.com
    arch: amd64
    distribution: ubuntu
    image_type: img
  nodes:
    # https://dev.to/topeogunleye/how-to-install-postgresql-18-on-ubuntu-2404-1doc
    postgres-primary:
      machine_type: "primary"
      cpu: 2
      memory: 4096
      disk_size: 51200 # 50 GB
      datastore_id: default
      network_config: |
        version: 2
        ethernets:
          enp1s0:
            dhcp4: false
            addresses:
              - 192.168.1.120/24
            routes:
              - to: default
                via: 192.168.1.1
            nameservers:
              addresses: [1.1.1.1,1.0.0.1]
      meta_data: |
        instance-id: vm1-001
        local-hostname: ubuntu-vm1
      user_data: |
        #cloud-config
        # Set root password to "password" (change this!)
        chpasswd:
          list: |
            root:password
          expire: false

        # Enable SSH password authentication
        ssh_pwauth: true

        # Install and enable SSH server
        packages:
          - openssh-server

        # Optional: Add SSH public key for key-based auth (more secure)
        ssh_authorized_keys:
          - ssh-rsa  songhanpoo

        # Set timezone
        timezone: Asia/Ho_Chi_Minh

        # Final message on console
        final_message: "VM1 is ready! SSH: ssh root@<IP>"
    redis:
      machine_type: "primary"
      cpu: 1
      memory: 2048
      disk_size: 51200 # 50 GB
      datastore_id: default
      network_config: |
        version: 2
        ethernets:
          enp1s0:
            dhcp4: false
            addresses:
              - 192.168.1.110/24
            routes:
              - to: default
                via: 192.168.1.1
            nameservers:
              addresses: [1.1.1.1,1.0.0.1]
      meta_data: |
        instance-id: paulsrv-001
        local-hostname: redis-server
      user_data: |
        #cloud-config
        # Set root password to "password" (change this!)
        chpasswd:
          list: |
            root:password
          expire: false

        # Enable SSH password authentication
        ssh_pwauth: true

        # Install and enable SSH server
        packages:
          - openssh-server

        # Optional: Add SSH public key for key-based auth (more secure)
        ssh_authorized_keys:
          - ssh-rsa  songhanpoo

        # Set timezone
        timezone: Asia/Ho_Chi_Minh

        # Final message on console
        final_message: "paulsrv-001 is ready! SSH: ssh root@<IP>"
