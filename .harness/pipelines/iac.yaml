# One Terraform pipeline for both roots. Pick the target at run time:
#   TARGET=infra        -> infra/        (Talos, libvirt VMs)
#   TARGET=kube-addons  -> kube-addons/  (Helm releases and services on the cluster)
# Flow: Plan -> Approve (apply only) -> Apply. Steps stay at the repo root and point
# terraform (-chdir) and make (-C) at the target dir.
# Apply makes a fresh plan (stages do not share a plan file), so it can differ from the reviewed one.
# Harness text secrets required (all must exist for either target):
#   r2_access_key, r2_secret_key, r2_account_id (kube-addons state), harness_api_token (infra state),
#   ssh_private_key_b64 (ed25519), ssh_known_hosts_b64, kubeconfig_b64
#   Encode with: base64 < file | tr -d '\n'
pipeline:
  name: iacm
  identifier: iacm
  projectIdentifier: visabulletin
  orgIdentifier: default
  tags:
    iac: terraform
  properties:
    ci:
      codebase:
        connectorRef: songhanpoo     # Git connector for this repo
        repoName: homelab-infra
        build: <+input>
  variables:
    - name: TARGET
      type: String
      description: Which root to run
      value: <+input>.allowedValues(infra,kube-addons)
    - name: ACTION
      type: String
      description: plan = plan only, apply = plan, approve, apply
      value: <+input>.allowedValues(plan,apply)
    - name: SCOPE
      type: String
      description: kube-addons only. all = everything, or just the prod or nonprod tier
      value: <+input>.default(all).allowedValues(all,prod,nonprod)
  # Shows SCOPE only for kube-addons. Beta: needs the Harness flag PIPE_RUNTIME_INPUT_CONFIG.
  # This only changes the run form; the step scripts decide whether SCOPE is used.
  runtimeInputConfig:
    - target: pipeline.variables.SCOPE
      label: Add-on scope
      description: Which kube-addons tier to run
      visibleWhen:
        field: pipeline.variables.TARGET
        op: eq
        value: kube-addons
  stages:
    - stage:
        name: Plan
        identifier: plan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: paultalos   # Kubernetes connector on the LAN delegate
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform plan
                  identifier: tf_plan
                  type: Run
                  spec:
                    connectorRef: nexusdocker   # Docker registry connector (or drop for public pulls)
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                      TF_HTTP_PASSWORD: <+secrets.getValue("harness_api_token")>   # infra state backend
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                      SCOPE: <+pipeline.variables.SCOPE>
                    command: |
                      set -eu
                      apk add --no-cache make openssh-client >/dev/null
                      # SSH: libvirt (infra) and the remote Docker host (kube-addons)
                      mkdir -p ~/.ssh && chmod 700 ~/.ssh
                      echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
                      echo "$SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
                      chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
                      # kube-addons providers read this fixed path
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then
                        mkdir -p ~/.kube/talos-paul
                        echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/talos-paul/kubeconfig
                        chmod 600 ~/.kube/talos-paul/kubeconfig
                      fi
                      TF_DIR="<+pipeline.variables.TARGET>"
                      terraform -chdir="$TF_DIR" fmt -check -recursive
                      make -C "$TF_DIR" init
                      terraform -chdir="$TF_DIR" validate
                      # SCOPE applies to kube-addons only; empty means all
                      RUN_SCOPE=all
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then RUN_SCOPE="${SCOPE:-all}"; fi
                      case "$RUN_SCOPE" in
                        all) terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m ;;
                        prod|nonprod) make -C "$TF_DIR" "plan-$RUN_SCOPE" ARGS="-input=false -lock-timeout=5m" ;;
                        *) echo "Unknown SCOPE: $RUN_SCOPE" >&2; exit 1 ;;
                      esac
    - stage:
        name: Approve
        identifier: approve
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          execution:
            steps:
              - step:
                  name: Review plan
                  identifier: review_plan
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: Review the plan of the previous stage, then approve to apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
    - stage:
        name: Apply
        identifier: apply
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: paultalos
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform apply
                  identifier: tf_apply
                  type: Run
                  spec:
                    connectorRef: nexusdocker
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                      TF_HTTP_PASSWORD: <+secrets.getValue("harness_api_token")>   # infra state backend
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                      SCOPE: <+pipeline.variables.SCOPE>
                    command: |
                      set -eu
                      apk add --no-cache make openssh-client >/dev/null
                      # SSH: libvirt (infra) and the remote Docker host (kube-addons)
                      mkdir -p ~/.ssh && chmod 700 ~/.ssh
                      echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
                      echo "$SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
                      chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
                      # kube-addons providers read this fixed path
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then
                        mkdir -p ~/.kube/talos-paul
                        echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/talos-paul/kubeconfig
                        chmod 600 ~/.kube/talos-paul/kubeconfig
                      fi
                      TF_DIR="<+pipeline.variables.TARGET>"
                      make -C "$TF_DIR" init
                      # Pi-hole rejects concurrent writes, so kube-addons applies one resource at a time
                      PARALLELISM=10
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then PARALLELISM=1; fi
                      # SCOPE applies to kube-addons only; empty means all
                      RUN_SCOPE=all
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then RUN_SCOPE="${SCOPE:-all}"; fi
                      case "$RUN_SCOPE" in
                        all) terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m -parallelism="$PARALLELISM" ;;
                        prod|nonprod) make -C "$TF_DIR" "apply-$RUN_SCOPE" ARGS="-input=false -auto-approve -lock-timeout=5m -parallelism=1" ;;
                        *) echo "Unknown SCOPE: $RUN_SCOPE" >&2; exit 1 ;;
                      esac
