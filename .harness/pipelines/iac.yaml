# One Terraform pipeline, one root per run. The shell logic is in .harness/scripts/terraform.sh.
#
#   TARGET               manages                                      credentials used
#   infra                libvirt VMs and the Talos cluster            SSH
#   kube-addons/prod     ingress, storage, DNS, Traefik, metrics      SSH, kubeconfig
#   databases/nonprod    PostgreSQL databases, roles and grants       none extra
#   kube-addons/nonprod  applications                                 kubeconfig
#
# Create or update in the order above. Destroy in the reverse order.
# After infra rebuilds the cluster, update the kubeconfig_b64 secret before running kube-addons.
#
# Flow: Plan -> Approve -> Execute. ACTION=plan stops after Plan, and a plan with no changes
# skips the other two stages. destroy needs CONFIRM_DESTROY=destroy-<TARGET>.
# Execute plans again and stops unless the commit and the list of changes (addresses and
# actions, not values) match what Plan showed. It then applies exactly that new plan file.
#
# The pipeline is stored Inline in Harness: after editing this file, paste it into Harness again.
# Script changes need only a push.
# Harness text secrets: harness_api_token (state; access to every workspace above),
#   ssh_private_key_b64, ssh_known_hosts_b64, kubeconfig_b64. Encode: base64 < file | tr -d '\n'
pipeline:
  name: iacm
  identifier: iacm
  projectIdentifier: visabulletin
  orgIdentifier: default
  tags:
    iac: terraform
  properties:
    ci:
      codebase:
        connectorRef: songhanpoo     # Git connector for this repo
        repoName: homelab-infra
        build: <+input>
  variables:
    - name: TARGET
      type: String
      description: Which root to run (create in this order; destroy in reverse)
      value: <+input>.allowedValues(infra,kube-addons/prod,databases/nonprod,kube-addons/nonprod)
    - name: ACTION
      type: String
      description: plan = plan only. apply or destroy = plan, approve, then run it
      value: <+input>.allowedValues(plan,apply,destroy)
    - name: CONFIRM_DESTROY
      type: String
      description: Only for destroy. Type destroy-<TARGET>, e.g. destroy-infra or destroy-kube-addons/nonprod
      value: <+input>.default(no)
  stages:
    - stage:
        name: Plan
        identifier: plan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: paultalos   # Kubernetes connector on the LAN delegate
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform plan
                  identifier: tf_plan
                  type: Run
                  spec:
                    connectorRef: nexusdocker   # Docker registry connector (or drop for public pulls)
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      TF_HTTP_PASSWORD: <+secrets.getValue("harness_api_token")>   # Terraform state backend
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                      TARGET: <+pipeline.variables.TARGET>
                      ACTION: <+pipeline.variables.ACTION>
                      CONFIRM_DESTROY: <+pipeline.variables.CONFIRM_DESTROY>
                    command: |
                      set -eu
                      sh .harness/scripts/terraform.sh plan /tmp/plan-outputs.env
                      . /tmp/plan-outputs.env
                      export HAS_CHANGES PLAN_FINGERPRINT
                    outputVariables:
                      - name: HAS_CHANGES
                      - name: PLAN_FINGERPRINT
    - stage:
        name: Approve
        identifier: approve
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> != "plan" && <+pipeline.stages.plan.spec.execution.steps.tf_plan.output.outputVariables.HAS_CHANGES> == "true"
        spec:
          execution:
            steps:
              - step:
                  name: Review plan
                  identifier: review_plan
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: "ACTION=<+pipeline.variables.ACTION> on <+pipeline.variables.TARGET>. Check the change summary at the end of the Plan log before approving. Destroy permanently deletes resources and data."
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
    - stage:
        name: Execute
        identifier: execute
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> != "plan" && <+pipeline.stages.plan.spec.execution.steps.tf_plan.output.outputVariables.HAS_CHANGES> == "true"
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: paultalos   # Kubernetes connector on the LAN delegate
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform apply or destroy
                  identifier: tf_execute
                  type: Run
                  spec:
                    connectorRef: nexusdocker   # Docker registry connector (or drop for public pulls)
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      TF_HTTP_PASSWORD: <+secrets.getValue("harness_api_token")>   # Terraform state backend
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                      TARGET: <+pipeline.variables.TARGET>
                      ACTION: <+pipeline.variables.ACTION>
                      CONFIRM_DESTROY: <+pipeline.variables.CONFIRM_DESTROY>
                      PLAN_FINGERPRINT: <+pipeline.stages.plan.spec.execution.steps.tf_plan.output.outputVariables.PLAN_FINGERPRINT>
                    command: |
                      set -eu
                      sh .harness/scripts/terraform.sh apply
