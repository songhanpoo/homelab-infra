# One Terraform pipeline for both roots. Pick the target at run time:
#   TARGET=infra        -> infra/        (Talos, libvirt VMs)
#   TARGET=kube-addons  -> kube-addons/  (Helm releases and services on the cluster)
# Flow: Plan -> Approve (apply only) -> Apply. Both stages work inside the target dir.
# Apply makes a fresh plan (stages do not share a plan file), so it can differ from the reviewed one.
# Harness text secrets required (all must exist for either target):
#   r2_access_key, r2_secret_key, r2_account_id,
#   ssh_private_key_b64 (ed25519), ssh_known_hosts_b64, kubeconfig_b64
#   Encode with: base64 < file | tr -d '\n'
pipeline:
  name: IaC - terraform
  identifier: iac_terraform
  projectIdentifier: <+input>
  orgIdentifier: default
  tags:
    iac: terraform
  properties:
    ci:
      codebase:
        connectorRef: <+input>     # Git connector for this repo
        repoName: <+input>
        build: <+input>
  variables:
    - name: TARGET
      type: String
      description: Which root to run
      value: <+input>.allowedValues(infra,kube-addons)
    - name: ACTION
      type: String
      description: plan = plan only, apply = plan, approve, apply
      value: <+input>.allowedValues(plan,apply)
  stages:
    - stage:
        name: Plan
        identifier: plan
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>   # Kubernetes connector on the LAN delegate
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform plan
                  identifier: tf_plan
                  type: Run
                  spec:
                    connectorRef: <+input>   # Docker registry connector (or drop for public pulls)
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                    command: |
                      set -eu
                      apk add --no-cache make openssh-client >/dev/null
                      # SSH: libvirt (infra) and the remote Docker host (kube-addons)
                      mkdir -p ~/.ssh && chmod 700 ~/.ssh
                      echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
                      echo "$SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
                      chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
                      # kube-addons providers read this fixed path
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then
                        mkdir -p ~/.kube/talos-paul
                        echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/talos-paul/kubeconfig
                        chmod 600 ~/.kube/talos-paul/kubeconfig
                      fi
                      cd <+pipeline.variables.TARGET>
                      terraform fmt -check -recursive
                      make init
                      make validate
                      terraform plan -input=false -lock-timeout=5m
    - stage:
        name: Approve
        identifier: approve
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          execution:
            steps:
              - step:
                  name: Review plan
                  identifier: review_plan
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: Review the plan of the previous stage, then approve to apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
    - stage:
        name: Apply
        identifier: apply
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform apply
                  identifier: tf_apply
                  type: Run
                  spec:
                    connectorRef: <+input>
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                      SSH_KEY_B64: <+secrets.getValue("ssh_private_key_b64")>
                      SSH_KNOWN_HOSTS_B64: <+secrets.getValue("ssh_known_hosts_b64")>
                      KUBECONFIG_B64: <+secrets.getValue("kubeconfig_b64")>
                    command: |
                      set -eu
                      apk add --no-cache make openssh-client >/dev/null
                      # SSH: libvirt (infra) and the remote Docker host (kube-addons)
                      mkdir -p ~/.ssh && chmod 700 ~/.ssh
                      echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
                      echo "$SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
                      chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
                      # kube-addons providers read this fixed path
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then
                        mkdir -p ~/.kube/talos-paul
                        echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/talos-paul/kubeconfig
                        chmod 600 ~/.kube/talos-paul/kubeconfig
                      fi
                      cd <+pipeline.variables.TARGET>
                      make init
                      # Pi-hole rejects concurrent writes, so kube-addons applies one resource at a time
                      PARALLELISM=10
                      if [ "<+pipeline.variables.TARGET>" = "kube-addons" ]; then PARALLELISM=1; fi
                      terraform apply -input=false -auto-approve -lock-timeout=5m -parallelism="$PARALLELISM"
