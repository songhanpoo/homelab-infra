# Redis configuration with Harness IaCM Ansible. Setup: others/ansible/README.md
# Flow: Approve -> Ansible. The run is a dry run unless the Playbook's dry_run variable is "false".
# PostgreSQL is deliberately not part of this pipeline.
# "playbooks" and "inventories" below are the identifiers of what you create in the Harness UI.
# The pipeline is stored Inline in Harness: paste it again after editing.
pipeline:
  name: ansible-redis
  identifier: ansibleredis
  projectIdentifier: visabulletin
  orgIdentifier: default
  tags:
    iac: ansible
  stages:
    - stage:
        name: Approve
        identifier: approve
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Review run
                  identifier: review_run
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: "Ansible Redis run. Check the playbook's dry_run variable first: false changes the server."
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
    - stage:
        name: Ansible
        identifier: ansible
        type: IACM
        spec:
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: paultalos # Kubernetes connector on the LAN delegate
              namespace: harness-executions
              os: Linux
          execution:
            steps:
              - step:
                  name: run playbook
                  identifier: run_playbook
                  type: IACMAnsiblePlugin
                  timeout: 30m
                  spec:
                    command: run
          playbooks:
            - redis
          inventories:
            - homelab_databases
