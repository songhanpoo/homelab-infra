# Harness pipeline: IaC - infra (Talos/VM/K8s)  (working dir: infra/)
# Flow: Plan -> manual approval -> Apply. Apply re-runs plan with -auto-approve semantics
# on the same commit, so what was approved is what gets applied.
pipeline:
  name: IaC - infra (Talos/VM/K8s)
  identifier: iac_infra
  projectIdentifier: <+input>      # or hard-code your Harness project
  orgIdentifier: default
  tags:
    iac: terraform
  properties:
    ci:
      codebase:
        connectorRef: <+input>     # Git connector pointing at this repo
        repoName: <+input>
        build: <+input>
  variables:
    - name: ENV
      type: String
      value: dev
    - name: ACTION
      type: String
      description: plan-only | apply
      value: apply
  stages:
    - stage:
        name: Plan
        identifier: plan
        type: CI
        spec:
          cloneCodebase: true
          # Must run where it can reach the target (libvirt host / k8s API / R2).
          # Point connectorRef at the Kubernetes connector backed by your delegate.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform plan
                  identifier: tf_plan
                  type: Run
                  spec:
                    connectorRef: <+input>   # Docker registry connector (or drop for public pulls)
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      ENV: <+pipeline.variables.ENV>
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                    command: |
                      apk add --no-cache make >/dev/null
                      cd infra
                      make init
                      terraform fmt -check -recursive
                      make validate
                      terraform plan -input=false
    - stage:
        name: Approve
        identifier: approve
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          execution:
            steps:
              - step:
                  name: Review plan
                  identifier: review_plan
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: Review the plan output of the previous stage, then approve to apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
    - stage:
        name: Apply
        identifier: apply
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.ACTION> == "apply"
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: harness-executions
          execution:
            steps:
              - step:
                  name: terraform apply
                  identifier: tf_apply
                  type: Run
                  spec:
                    connectorRef: <+input>
                    image: hashicorp/terraform:1.12.2
                    shell: Sh
                    envVariables:
                      ENV: <+pipeline.variables.ENV>
                      R2_ACCESS_KEY: <+secrets.getValue("r2_access_key")>
                      R2_SECRET_KEY: <+secrets.getValue("r2_secret_key")>
                      R2_ACCOUNT_ID: <+secrets.getValue("r2_account_id")>
                    command: |
                      apk add --no-cache make >/dev/null
                      cd infra
                      make init
                      make apply-auto
