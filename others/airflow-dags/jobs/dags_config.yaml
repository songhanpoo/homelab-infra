# Default settings shared across all DAGs/tasks unless overridden
defaults:
  # NOTE: this tag predates the extract_perm rework (direct DB upsert,
  # dol_pwd_remaining_requests / dol_perm_avg_processing_days tables, PWD
  # per-queue processes) and the seed_perm removal below. Rebuild and push
  # a new image, then bump this tag, before the next `perm` DAG run.
  image: "nexus-docker-private.local.proxy/visa-bulletin:22bb612d-10"
  namespace: "kube-orchestrations"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  host_aliases:
    - ip: "192.168.1.98"
      hostnames:
        - "crawl4ai.localdev.me"
        - "flaresolver.localdev.me"
  secret_env_name: "visa-bulletin-dag"
  retries: 2
  retry_delay_minutes: 10

dags:
  - dag_id: "perm"
    # DOL publishes PWD/PERM "COB at the end of the first work week of each
    # month, for data ending 12am EST on the first of the month" — so this
    # runs daily over days 1-10 rather than once. extract_perm upserts
    # keyed on bulletin_month (parsed from the page's own "as of" date), so
    # every run past the real publish day is a no-op, and a late publish
    # still gets picked up within the window.
    schedule: "0 13 1-10 * *"
    start_date: "2021-01-01"
    catchup: false
    tasks:
      # seed_perm no longer exists — extract_perm now parses + upserts
      # directly in one step (schema.prisma / commands.py, see visa-bulletin).
      - task_id: "extract_perm"
        name: "extract-perm"
        scenario: "extract_perm"

  - dag_id: "visa_bulletin_url"
    # DOS publishes each month's bulletin on a date that varies slightly;
    # poll daily from day 15-29 and let extract_and_seed_visa_bulletin_url's
    # idempotent upsert (keyed on bulletin month) make repeat runs a no-op.
    schedule: "0 13 15-29 * *"
    start_date: "2021-01-01"
    catchup: false
    tasks:
      - task_id: "extract_and_seed_visa_bulletin_url"
        name: "extract-and-seed-visa-bulletin-url"
        scenario: "extract_and_seed_visa_bulletin_url"
        arguments:
          - "--url={{ visa_bulletin_url_for_today() }}"
