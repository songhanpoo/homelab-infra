
id: visa-bulletin-extract-and-seed-url
namespace: visa_bulletin
description: >
  DOS publishes each month's bulletin on a varying day. Polls daily on days 15-29; the upsert keyed on bulletin month makes repeat runs no-ops.

tasks: 
  - id: build_url
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {% set nxt = now() | dateAdd(1, 'MONTHS')%}
      https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin/{{ (nxt | date('M') | number) >= 10 ? ((nxt | date('yyyy') | number) + 1) : (nxt | date('yyyy')) }}/visa-bulletin-for-{{ nxt | date('MMMM') | lower }}-{{ nxt |date('yyyy') }}.html

  - id: log_url
    type: io.kestra.plugin.core.log.Log
    message: "URL = {{ outputs.build_url.value }}"

  - id: extract_and_seed_visa_bulletin_url
    type: io.kestra.plugin.kubernetes.PodCreate
    namespace: kestra-executions
    delete: false
    waitUntilRunning: PT5M
    waitRunning: PT30M
    retry:
      type: constant
      interval: PT10M
      maxAttempts: 1
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: nexus-docker-registries
      hostAliases:
      - ip: 192.168.1.98
        hostnames:
          - crawl4ai.localdev.me
          - flaresolver.localdev.me
      containers:
        - name: extract-and-seed
          image: nexus-docker-private.local.proxy/visa-bulletin:latest
          imagePullPolicy: Always
          args:
            - --scenario=extract_and_seed_visa_bulletin_url
            - --url={{ outputs.build_url.value  | trim }}
          env:
            - { name: NO_PROXY, value: "" }
            - { name: no_proxy, value: "" }
          envFrom:
            - secretRef:
                name: visa-bulletin-dag
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi, cpu: 500m }
triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 13 15-29 * *"
    disabled: false


