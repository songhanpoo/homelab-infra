apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "thinkread.fullname" . }}-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "5Gi" }}
  {{- if .Values.controller.persistence.storageClass }}
  storageClassName: {{ .Values.controller.persistence.storageClass }}
  {{- end }}