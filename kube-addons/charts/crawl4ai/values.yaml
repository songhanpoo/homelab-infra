# Default values for crawl4ai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: unclecode/crawl4ai
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Keep in step with files/supervisord.conf, which is copied from this image version.
  tag: "0.8"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# The image already runs as appuser (999). These settings were tested with image 0.8: health,
# crawl, markdown, HTML, PDF and screenshot work as they do without them.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# The only writable folders (emptyDir, emptied when the pod is replaced). None of them holds files
# from the image. /home/appuser/.cache stays read-only: the browser is installed there.
writableDirs:
  - { name: tmp, mountPath: /tmp, sizeLimit: 1Gi } # also Redis data and the supervisor pid file
  - { name: crawl4ai-home, mountPath: /home/appuser/.crawl4ai, sizeLimit: 512Mi }
  - { name: gunicorn-home, mountPath: /home/appuser/.gunicorn, sizeLimit: 16Mi }
  - { name: config-home, mountPath: /home/appuser/.config, sizeLimit: 128Mi }
  - { name: local-home, mountPath: /home/appuser/.local, sizeLimit: 128Mi }

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 11235  # crawl4ai default port
  targetPort: 11235

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: crawl4ai.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: crawl4ai-tls
  #    hosts:
  #      - crawl4ai.local

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# crawl4ai specific configuration
crawl4ai:
  # LLM configuration (optional)
  llm:
    enabled: false
    # Create secret from existing .llm.env file
    # kubectl create secret generic crawl4ai-llm-env --from-env-file=.llm.env
    existingSecret: ""
    
  # Custom config.yml (optional)
  config:
    enabled: false
    # Create configmap from existing config.yml file
    # kubectl create configmap crawl4ai-config --from-file=config.yml
    existingConfigMap: ""

# Environment variables
env: []
# - name: EXAMPLE_ENV
#   value: "example-value"

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
