cloudflared:
  name: "cloudflared"
  repository: "https://community-charts.github.io/helm-charts"
  chart: "cloudflared"
  namespace: "kube-orchestrations"
  values_yaml:
    replica:
      allNodes: false
      count: 1
    tunnelConfig:
      name: "Paul CloudFlared Tunnel"
      logLevel: "info"
    tunnelSecrets:
      # Use base64 -b 0 -i ~/.cloudflared/*.json to generate these
      base64EncodedConfigJsonFile: "eyJBY2NvdW50VGFnIjoiZmUwMDRjYTFiYjY4YzEyMWE5NWFiZGU0OTIzY2FhNjYiLCJUdW5uZWxTZWNyZXQiOiJhdVlsaGJKaWNUM1A2ZWxaZlFZMUJPR3ZXdksxNExPUHBWTjRxY0EwSGdNPSIsIlR1bm5lbElEIjoiOWI2MzMzNTItY2E3Zi00MDkxLTg3ZjktY2Y2NmYyYWFmNTdiIiwiRW5kcG9pbnQiOiIifQ=="
      base64EncodedPemFile: ""
    ingress:
      # Example rule: proxy traffic from Cloudflare into the cluster's internal readest service
      - hostname: "stump.booo.dev"
        service: "http://stump.kube-orchestrations.svc.cluster.local:10801"
      - service: "http_status:404"
