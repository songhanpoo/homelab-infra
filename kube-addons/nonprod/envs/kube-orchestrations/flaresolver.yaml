flaresolver:
  name: "flaresolver"
  namespace: "kube-orchestrations"
  chart: "flaresolverr"
  repository: https://k8s-at-home.com/charts/
  version: "2.2.0"
  values_yaml:
    image:
      repository: nexus-docker.local.proxy/flaresolverr/flaresolverr
      tag: v3.5.2
    ingress:
      enabled: true
      ingressClassName: "nginx-internal"
      hosts:
        - host: "flaresolver.localdev.me"
          paths:
            - path: "/"
              pathType: "Prefix"
